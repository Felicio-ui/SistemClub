<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubManager — Editar Administrador</title>

    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/pages.css">
</head>

<body class="dashboard-page">

    <div id="app-header"></div>
    <div id="app-sidebar"></div>

    <main class="app-main">

        <div class="page-header">
            <div>
                <h1 class="app-main__title">Editar Administrador</h1>
                <p class="app-main__subtitle">Atualizar os dados do administrador</p>
            </div>
            <div class="page-header__actions">
                <a href="lista.html" class="btn btn-outline">← Voltar</a>
            </div>
        </div>

        <section class="card">
            <form id="form-admin" class="form">

                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" name="nome" required minlength="2" maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="apelido">Apelido</label>
                        <input type="text" id="apelido" name="apelido" maxlength="100">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required maxlength="100">
                </div>

                <div class="form-group">
                    <label for="senha">Nova Palavra-passe (deixe vazio para manter)</label>
                    <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6"
                        maxlength="100">
                </div>

                <div id="form-erro" class="alert alert-danger" style="display: none;"></div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="btn-submeter">
                        Guardar Alterações
                    </button>
                    <a href="lista.html" class="btn btn-outline">Cancelar</a>
                </div>

            </form>
        </section>

    </main>

    <script type="module" src="../../js/pages/admins-editar.js"></script>
</body>

</html>
