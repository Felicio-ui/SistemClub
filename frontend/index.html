<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubManager — Login</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body class="login-page">

    <header class="login-header">
        <img src="assets/images/278238083225297007.jpg" alt="ClubManager" class="login-header__logo"
            onerror="this.style.display='none'">
    </header>

    <main class="login-main">
        <section class="login-card">
            <div class="login-card__header">
                <h1>Bem-vindo</h1>
                <p>Inicie sessão para continuar</p>
            </div>

            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="o.teu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Palavra-passe</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="login-actions">
                    <button type="submit" class="btn-login">Entrar</button>
                    <a href="#" class="login-link">Esqueci a senha</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="login-footer">
        <p>© 2025 ClubManager — Todos os direitos reservados.</p>
    </footer>

    <script type="module" src="js/pages/login.js"></script>
</body>

</html>
