<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubManager — Registar Administrador</title>

    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/pages.css">
</head>

<body class="dashboard-page">

    <div id="app-header"></div>
    <div id="app-sidebar"></div>

    <main class="app-main">

        <!-- Cabeçalho -->
        <div class="page-header">
            <div>
                <h1 class="app-main__title">Registar Administrador</h1>
                <p class="app-main__subtitle">Adicionar um novo administrador à plataforma</p>
            </div>
            <div class="page-header__actions">
                <a href="lista.html" class="btn btn-outline">← Voltar</a>
            </div>
        </div>

        <!-- Formulário -->
        <section class="card">
            <form id="form-admin" class="form">

                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" name="nome" placeholder="Ex: Felicio" required minlength="2"
                            maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="apelido">Apelido</label>
                        <input type="text" id="apelido" name="apelido" placeholder="Ex: Jorge" maxlength="100">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="nome@clubmanager.mz" required
                        maxlength="100">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="senha">Palavra-passe *</label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required
                            minlength="6" maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar Palavra-passe *</label>
                        <input type="password" id="confirmarSenha" name="confirmarSenha"
                            placeholder="Repita a palavra-passe" required minlength="6" maxlength="100">
                    </div>
                </div>

                <!-- Mensagem de erro -->
                <div id="form-erro" class="alert alert-danger" style="display: none;"></div>

                <!-- Ações -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="btn-submeter">
                        Guardar Administrador
                    </button>
                    <a href="lista.html" class="btn btn-outline">Cancelar</a>
                </div>

            </form>
        </section>

    </main>

    <script type="module" src="../../js/pages/admins-registar.js"></script>
</body>

</html>
